syntax = "proto3";

package market;

option java_multiple_files = true;
option java_package = "market";

message Trade {
  string event_type = 1;
  int64 event_time = 2;
  string symbol = 3;
  int64 agg_trade_id = 4;
  string price = 5;
  string quantity = 6;
  int64 first_trade_id = 7;
  int64 last_trade_id = 8;
  int64 trade_time = 9;
  bool buyer_is_market_maker = 10;
}
